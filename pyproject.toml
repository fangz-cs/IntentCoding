[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentcoding"
version = "0.1.0"
description = "Intent-amplified decoding for code generation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Zheng Fang"},
    {name = "Yihong Dong"},
    {name = "Lili Mou"},
    {name = "Dongming Jin"},
    {name = "Zhi Jin"},
    {name = "Ge Li"},
]
keywords = ["code generation", "decoding", "user intent"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.45,<5",
]

[project.urls]
Paper = "https://aclanthology.org/2026.findings-acl.1662/"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
intentcoding = "intentcoding.cli:main"
intentcoding-build-codeconstraints = "intentcoding.codeconstraints:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
